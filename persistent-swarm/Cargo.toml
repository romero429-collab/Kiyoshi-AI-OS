[package]
name = "persistent-swarm"
version = "0.1.0"
edition = "2021"
authors = ["Kiyoshi OS"]
description = "Genesis Nexus - Persistent backbone for the Kiyoshi macroscopic coupled map lattice"

[dependencies]
tokio = { version = "1", features = ["full"] }
webrtc = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
nalgebra = "0.33"
rand = "0.8"
thiserror = "1.0"
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"
flatbuffers = "23.5.26"

[dev-dependencies]
tokio-test = "0.4"