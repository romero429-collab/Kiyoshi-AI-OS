<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiyoshi Advanced ADE DDS Simulation</title>
<style>
body { margin: 0; overflow: hidden; background: #000; color: #0ff; font-family: monospace; }
#controls { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75); padding: 12px; border: 1px solid #0ff; max-height: 90vh; overflow-y: auto; }
label { display: block; margin: 4px 0; font-size: 12px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="controls">
<label>γ_C: <input type="range" id="gamma" min="0.1" max="2.5" step="0.1" value="0.8"></label>
<label>η_W: <input type="range" id="eta" min="0.1" max="2.0" step="0.1" value="0.7"></label>
<label>α_B+β_D: <input type="range" id="swarm" min="0.1" max="3.0" step="0.1" value="1.2"></label>
<label>Substrate coupling: <input type="range" id="sub" min="0" max="1" step="0.05" value="0.3"></label>
<label>Governor α_g: <input type="range" id="gov" min="0.1" max="1.2" step="0.05" value="0.6"></label>
<div id="status">λ_max ≈ 0 | Governor residual: 0</div>
</div>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
camera.position.set(0, 5, 20);

const particles = [];
const geo = new THREE.BufferGeometry();
const pos = new Float32Array(300 * 3);
const col = new Float32Array(300 * 3);
for (let i = 0; i < 300; i++) {
  pos[i*3] = (Math.random()-0.5)*20;
  pos[i*3+1] = (Math.random()-0.5)*10;
  pos[i*3+2] = (Math.random()-0.5)*10;
  particles.push({v: new THREE.Vector3()});
}
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
scene.add(new THREE.Points(geo, new THREE.PointsMaterial({size: 0.12, vertexColors: true})));

// Lane cubes
const lanes = [];
for (let i = 0; i < 4; i++) {
  const cube = new THREE.Mesh(new THREE.BoxGeometry(1.5,1.5,1.5), new THREE.MeshBasicMaterial({color: 0x0044ff, wireframe: true}));
  cube.position.x = (i-1.5)*4;
  scene.add(cube);
  lanes.push(cube);
}

// SpudCell spheres
const cells = [];
for (let i = 0; i < 3; i++) {
  const sph = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 12), new THREE.MeshBasicMaterial({color: 0x00ff88, wireframe: true, transparent: true, opacity: 0.6}));
  sph.position.set(Math.sin(i)*6, 2, Math.cos(i)*6);
  scene.add(sph);
  cells.push(sph);
}

// Mycelial lines (simple)
const mycelial = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-8,0,0), new THREE.Vector3(8,0,0)]), new THREE.LineBasicMaterial({color: 0xff00ff}));
scene.add(mycelial);

function update() {
  const gamma = parseFloat(document.getElementById('gamma').value);
  const eta = parseFloat(document.getElementById('eta').value);
  const swarm = parseFloat(document.getElementById('swarm').value);
  const sub = parseFloat(document.getElementById('sub').value);
  const gov = parseFloat(document.getElementById('gov').value);

  const lambda = Math.max(Math.log(Math.max(gamma, eta, swarm/2)), -1) * (1 - gov*0.5);
  const govRes = Math.abs(1 - gov);
  document.getElementById('status').textContent = `λ_max ≈ ${lambda.toFixed(3)} | Governor residual: ${govRes.toFixed(2)}`;

  const p = geo.attributes.position.array;
  const c = geo.attributes.color.array;
  for (let i = 0; i < 300; i++) {
    const v = particles[i].v;
    const fx = -0.04 * p[i*3] * (1 - gamma*0.25) * (1 + sub*0.5);
    const fy = -0.04 * p[i*3+1] * (1 - eta*0.3);
    const fz = -0.03 * p[i*3+2] * (1 - swarm*0.15) * gov;
    v.x = v.x*0.96 + fx; v.y = v.y*0.96 + fy; v.z = v.z*0.96 + fz;
    p[i*3] += v.x; p[i*3+1] += v.y; p[i*3+2] += v.z;
    if (lambda < 0) { c[i*3]=0.2; c[i*3+1]=0.5; c[i*3+2]=1; }
    else { c[i*3]=1; c[i*3+1]=0.3; c[i*3+2]=0.2; }
  }
  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate = true;

  lanes.forEach((l,i) => { l.rotation.y += 0.005 * (1+gamma); l.scale.setScalar(1 + 0.1*Math.sin(Date.now()*0.001+i)); });
  cells.forEach((s,i) => { s.scale.setScalar(0.8 + sub*0.4 + 0.1*Math.sin(Date.now()*0.002+i)); });
  mycelial.rotation.z += 0.002 * swarm;
}

function animate() { requestAnimationFrame(animate); update(); renderer.render(scene, camera); }
animate();
window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
</script>
</body>
</html>
